name: APK derle

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK oluştur
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk varsak-sosyal.apk

      - name: İndirme sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Varsak Sosyal APK (son sürüm)"
          body: |
            Telefona kurmak için aşağıdaki **varsak-sosyal.apk** dosyasını indirin.
            Derleme no: ${{ github.run_number }}
          files: varsak-sosyal.apk
          make_latest: true
