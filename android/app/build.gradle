plugins {
    id 'com.android.application'
}

android {
    namespace 'com.varsak.sosyal'
    compileSdk 34

    defaultConfig {
        applicationId "com.varsak.sosyal"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        // Sabit imza: her derleme aynı anahtarla imzalanır, telefonda güncelleme sorunsuz kurulur.
        varsak {
            storeFile file("varsak-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.varsak
        }
        debug {
            signingConfig signingConfigs.varsak
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
